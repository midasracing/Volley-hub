name: Update Pomorska III Liga Męska

on:
  push:
    paths:
      - ".github/workflows/update-pomorska3liga.yml"
      - "scripts/update_pomorska3liga.py"
      - "app.js"
      - "index.html"
      - "sw.js"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-pomorska3liga
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install scraper dependencies
        run: python -m pip install beautifulsoup4 playwright requests
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Install Puppeteer Extra and Stealth plugin
        run: npm install --no-save puppeteer puppeteer-extra puppeteer-extra-plugin-stealth
      - name: Diagnose VolleyStation access
        run: |
          python - <<'PY'
          import requests
          from playwright.sync_api import sync_playwright

          url = "https://pomorskie.volleystation.com/pl/phase-6796-pomorska-iii-liga-meska/schedule/"
          print("=== Plain HTTPS request ===", flush=True)
          try:
              r = requests.get(url, timeout=25)
              print(f"HTTP {r.status_code}; server={r.headers.get('server')}; title/snippet={r.text[:220]!r}", flush=True)
          except Exception as e:
              print(f"REQUEST ERROR: {type(e).__name__}: {e}", flush=True)

          print("=== Playwright Chromium ===", flush=True)
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page(locale="pl-PL")
                  response = page.goto(url, wait_until="domcontentloaded", timeout=40000)
                  page.wait_for_timeout(3000)
                  print(f"HTTP {response.status if response else 'no response'}; title={page.title()!r}; body={page.locator('body').inner_text()[:220]!r}", flush=True)
                  browser.close()
          except Exception as e:
              print(f"PLAYWRIGHT ERROR: {type(e).__name__}: {e}", flush=True)
          PY
          node <<'JS'
          const puppeteer = require('puppeteer-extra');
          const StealthPlugin = require('puppeteer-extra-plugin-stealth');
          puppeteer.use(StealthPlugin());
          const url = 'https://pomorskie.volleystation.com/pl/phase-6796-pomorska-iii-liga-meska/schedule/';
          (async () => {
            let browser;
            try {
              browser = await puppeteer.launch({ headless: true, args: ['--no-sandbox', '--disable-setuid-sandbox'] });
              const page = await browser.newPage();
              await page.setExtraHTTPHeaders({ 'Accept-Language': 'pl-PL,pl;q=0.9,en;q=0.8' });
              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 40000 });
              await new Promise(resolve => setTimeout(resolve, 3000));
              console.log('=== Puppeteer Extra + Stealth plugin (authorized VolleyStation security test) ===');
              console.log('HTTP:', response ? response.status() : 'no response');
              console.log('Title:', await page.title());
              console.log('Body:', (await page.locator('body').innerText()).slice(0, 220));
            } catch (error) {
              console.log('PUPPETEER ERROR:', error.name, error.message);
            } finally {
              if (browser) await browser.close();
            }
          })();
          JS
      - name: Fetch official VolleyStation data
        run: python scripts/update_pomorska3liga.py
      - name: Commit updated data when changed
        run: |
          if ! git diff --quiet -- data/pomorska3liga.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pomorska3liga.json
            git commit -m "Update Pomorska III Liga data"
            git push
          else
            echo "No fixture changes."
          fi
