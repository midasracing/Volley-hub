name: Validate local Pomorska III Liga importer

# Pomorska III liga is updated locally with `python -m local_scraper`.
# The former scheduled Stealth writer is retired; this workflow never writes feeds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install beautifulsoup4 requests filelock psutil
      - run: python -m unittest discover -s tests -p 'test_local_scraper.py' -v
      - run: python -m unittest discover -s tests -p 'test_volley_parity.py' -v
      - run: python -m unittest discover -s tests -p 'test_lower_leagues.py' -v
