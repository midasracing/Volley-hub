name: Update Pomorska III Liga Męska

on:
  push:
    paths:
      - ".github/workflows/update-pomorska3liga.yml"
      - "scripts/update_pomorska3liga.py"
      - "app.js"
      - "index.html"
      - "sw.js"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-pomorska3liga
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install beautifulsoup4
      - name: Fetch official VolleyStation data
        run: python scripts/update_pomorska3liga.py
      - name: Commit updated data when changed
        run: |
          if ! git diff --quiet -- data/pomorska3liga.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pomorska3liga.json
            git commit -m "Update Pomorska III Liga data"
            git push
          else
            echo "No fixture changes."
          fi
