name: PLS full match details audit
on:
  pull_request:
    paths:
      - 'scripts/refresh_tauron.py'
      - 'scripts/audit_pls.py'
      - 'tests/test_refresh_tauron.py'
      - '.github/workflows/pls-details-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprehensive-details:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Backfill official details for every fixture (2026/27)
        run: python -u scripts/refresh_tauron.py --full-details
      - name: Verify every fixture, every played set and detail coverage
        run: python -u scripts/audit_pls.py --check-details
