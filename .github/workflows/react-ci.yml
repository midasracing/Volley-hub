name: React CI
on:
  pull_request:
  push:
    branches: [feat/react-unified-ui]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-mobile-browser-screenshots
          path: test-results/contact-*.png
          if-no-files-found: ignore
          retention-days: 14
