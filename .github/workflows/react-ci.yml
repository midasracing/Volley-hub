name: React CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Diagnose complete season fixture markup
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from urllib.request import urlopen
          for league, url in [('men', 'https://www.tauronliga.pl/games/nocookies/1.html'), ('first', 'https://www.tauron1liga.pl/games/nocookies/1.html')]:
              soup = BeautifulSoup(urlopen(url, timeout=30).read(), 'html.parser')
              headings = [x for x in soup.find_all(['h2','h3','h4','h5','h6']) if 'Kolejka:' in x.get_text(' ', strip=True)]
              print(league, 'rounds:', len(headings), 'first headings', [h.get_text(' ', strip=True) for h in headings[:3]], flush=True)
              if headings:
                  h = headings[0]
                  print('round node:', str(h)[:1000], flush=True)
                  for parent in [h.parent, h.parent.parent]:
                      print('parent:', parent.name, parent.get('class'), 'text', parent.get_text(' ', strip=True)[:600], 'html', str(parent)[:1800], flush=True)
                  node=h
                  for _ in range(5):
                      node=node.next_element
                      print('next',getattr(node,'name',None),getattr(node,'get',lambda x:None)('class'),str(node)[:400],flush=True)
          PY
      - name: Live PLS importer smoke test (both leagues)
        run: |
          python scripts/refresh_tauron.py
          python - <<'PY'
          import json
          for key, file in [('men', 'data/tauron.json'), ('first', 'data/tauron1liga.json')]:
              data = json.load(open(file, encoding='utf-8'))
              games = data['matches']
              assert len(games) >= 4, (key, len(games))
              assert all(g.get('league') == key for g in games), key
              assert all(g.get('home') and g.get('away') for g in games), key
              assert all(g.get('date_iso') for g in games), key
              assert all('set_points' in g and 'home_points' in g for g in games), key
              assert all(len(g['set_points']) == len(g['set_scores']) for g in games), key
              assert all(g.get('competition') for g in games), key
              assert all(g.get('source_url') for g in games), key
              teams = data.get('teams', [])
              print(key, 'matches=', len(games), 'teams=', len(teams),
                    'logos=', sum(bool(t.get('logo')) for t in teams),
                    'with_hour=', sum(bool(g.get('time')) for g in games),
                    'with_venue=', sum(bool(g.get('venue')) for g in games),
                    'with_round=', sum(g.get('round') is not None for g in games),
                    'with_broadcast=', sum(bool(g.get('broadcast')) for g in games))
          PY
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
