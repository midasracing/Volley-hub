name: VolleyStation extended experiment battery

on:
  push:
    branches: [experiment/volleystation-20261106]
    paths:
      - .github/workflows/experiment-volleystation-battery.yml
      - experiments/volleystation/battery_*.py
      - experiments/volleystation/requirements-battery.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [cam-live, cam-linux, cam-cache, cam-fresh, cam-restart, cam-recorded, cam-handoff, nodriver-headless, nodriver-headful, stock-firefox, curl-profiles]
    env:
      LAB_BROWSER: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install experiment engines
        run: |
          python -m pip install -r experiments/volleystation/requirements-battery.txt
          if [[ "${{ matrix.case }}" == cam-* ]]; then
            python -m camoufox fetch
          fi
          if [[ "${{ matrix.case }}" == stock-firefox ]]; then
            python -m playwright install firefox
          fi
      - name: Run one bounded scenario
        run: |
          if [[ "${{ matrix.case }}" == cam-* ]]; then
            xvfb-run -a python experiments/volleystation/battery_cam.py --case "${{ matrix.case }}"
          else
            xvfb-run -a python experiments/volleystation/battery_other.py --case "${{ matrix.case }}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battery-${{ matrix.case }}
          path: experiments/volleystation/outputs/battery/${{ matrix.case }}/
