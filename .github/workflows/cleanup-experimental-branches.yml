name: One-time cleanup — old prototype branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-experimental-branches.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-repository-cleanup
  cancel-in-progress: false
jobs:
  verify-and-prune:
    if: github.ref == 'refs/heads/main' && github.repository == 'midasracing/Volley-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tests and production build before deleting branches
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Verify mobile browser before repository cleanup
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Delete obsolete prototype branches (main is excluded)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            design/rally-logo-skill-concepts \
            feat/contact-brand-rive \
            feat/react-bits-techtext-floating-header \
            feat/react-unified-ui \
            feat/rive-react-motion-system \
            feat/rive-wordmark-motion-v1
          do
            echo "Deleting obsolete branch: $branch"
            status="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .ref 2>/dev/null || true)"
            if [ "$status" = "refs/heads/$branch" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            else
              echo "Already absent: $branch"
            fi
          done
