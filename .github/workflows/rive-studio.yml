name: CONTACT — verify native Rive & publish binary
on:
  push:
    branches: [feat/contact-brand-rive, main]
    paths:
      - 'rive/contact/**'
      - 'public/brand/volley-hub-app-icon.svg'
      - '.github/workflows/rive-studio.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contact-brand-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Native Rive renderer prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgles2 libx11-6 libgl1 libxkbcommon0
      - name: Official Rive CLI
        run: |
          curl -fsSL https://releases.rive.app/cli/install.sh -o /tmp/install-rive.sh
          bash /tmp/install-rive.sh
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"
      - name: Verify markup and compile binary
        run: |
          rive --version
          rive rive/contact --verify
          rive rive/contact --once
          test -s rive/contact/build/contact.riv
          rive inspect rive/contact --json | tee /tmp/contact-inspection.json
          python - <<'PY'
          import json
          info=json.load(open('/tmp/contact-inspection.json'))
          if info.get('problems'):
              raise SystemExit('Rive inspect reported problems: '+str(info['problems']))
          PY
      - name: Render six genuine Rive keyframes
        run: |
          mkdir -p .rive-captures/contact
          for f in 1 12 23 39 54 70; do
            rive rive/contact --screenshot=".rive-captures/contact/frame-$f.png" --advance="$f"
          done
          file .rive-captures/contact/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: contact-brand-native-rive-proof
          path: |
            .rive-captures/contact/*.png
            rive/contact/build/contact.riv
          include-hidden-files: true
          retention-days: 30
      - name: Rasterize app icon from one vector master
        run: |
          python3 -m venv /tmp/contact-icon-venv
          /tmp/contact-icon-venv/bin/pip install --quiet --disable-pip-version-check cairosvg
          /tmp/contact-icon-venv/bin/python - <<'PY'
          import cairosvg
          for size in (192,512):
              cairosvg.svg2png(url='public/brand/volley-hub-app-icon.svg', write_to=f'public/brand/volley-hub-icon-{size}.png', output_width=size, output_height=size)
          PY
      - name: Update compiled runtime asset on feature branch only
        if: github.ref == 'refs/heads/feat/contact-brand-rive'
        run: |
          cp rive/contact/build/contact.riv public/brand/volley-hub.riv
          git add public/brand/volley-hub.riv public/brand/volley-hub-icon-192.png public/brand/volley-hub-icon-512.png
          if git diff --cached --quiet; then
            echo 'The native Rive asset is already current.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh CONTACT native Rive asset"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
