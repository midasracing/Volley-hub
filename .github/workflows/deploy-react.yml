name: Deploy React to GitHub Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "Refresh TAURON data"
      - "Update II Liga Mężczyzn"
      - "Update Pomorska III Liga Męska"
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual Rive route animation assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core libegl1 libgles2 libx11-6
          python -m pip install --quiet fonttools
          curl -fsSL https://releases.rive.app/cli/install.sh | sh
          export PATH="$HOME/.rive/bin:$PATH"
          python scripts/build_route_rml.py
          mkdir -p public/motion
          for route in home matches competitions favorites; do
            rive "motion/route/$route" --verify
            rive "motion/route/$route" --once
            cp "motion/route/$route/build/$route.riv" "public/motion/route-$route.riv"
          done
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify a real Vite production shell
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          grep -q 'assets/index-' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

