name: Deploy React to GitHub Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "Refresh TAURON data"
      - "Update II Liga Mężczyzn"
      - "Update Pomorska III Liga Męska"
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT=$(gh api 'repos/${{ github.repository }}/git/ref/heads/main' --jq '.object.sha')
          # A queued/failed deployment is not proof that CURRENT is published.
          LAST=''
          while read -r ID SHA; do
            STATE=$(gh api "repos/${{ github.repository }}/deployments/$ID/statuses?per_page=1" --jq '.[0].state // empty')
            if [ "$STATE" = 'success' ]; then
              LAST="$SHA"
              break
            fi
          done < <(gh api 'repos/${{ github.repository }}/deployments?environment=github-pages&per_page=10' --jq '.[] | "\(.id) \(.sha)"')
          if [ -n "$LAST" ] && [ "$CURRENT" = "$LAST" ]; then
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
            echo 'Published commit is unchanged; skipping rebuild.'
          else
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: verify
    if: needs.verify.outputs.should_build == 'true' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify a real Vite production shell
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          grep -q 'assets/index-' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

