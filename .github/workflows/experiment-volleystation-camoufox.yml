name: Verify VolleyStation Camoufox full import

on:
  push:
    branches: [experiment/volleystation-20261106]
    paths:
      - .github/workflows/experiment-volleystation-camoufox.yml
      - experiments/volleystation/camoufox_full.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Firefox experiment
        run: |
          python -m pip install -r experiments/volleystation/requirements-alternatives.txt
          python -m camoufox fetch
          python -m camoufox version
      - name: Full isolated import and profile restart verification
        run: xvfb-run -a python experiments/volleystation/camoufox_full.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volleystation-camoufox-full
          path: experiments/volleystation/outputs/camoufox-full/
