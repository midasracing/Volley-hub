name: Verify VolleyStation incremental Camoufox

on:
  push:
    branches: [experiment/volleystation-20261106]
    paths:
      - .github/workflows/experiment-volleystation-incremental.yml
      - experiments/volleystation/camoufox_incremental.py
      - experiments/volleystation/scraper_incremental.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  incremental-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Firefox experiment
        run: |
          python -m pip install -r experiments/volleystation/requirements-alternatives.txt
          python -m camoufox fetch
      - name: Verify cache invalidation without network
        run: python experiments/volleystation/test_incremental.py -v
      - name: Incremental isolated import and profile restart verification
        run: xvfb-run -a python experiments/volleystation/camoufox_incremental.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volleystation-camoufox-incremental
          path: experiments/volleystation/outputs/camoufox-incremental/
