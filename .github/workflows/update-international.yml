name: Update Italian and Japanese volleyball
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4,16 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_international.py'
      - 'tests/test_international.py'
      - 'scripts/international_names.py'
      - 'scripts/audit_international.py'
      - '.github/workflows/update-international.yml'
permissions:
  contents: write
concurrency:
  group: international-volleyball-feeds
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python -m unittest discover -s tests -p 'test_international.py' -v
      - name: Fetch official fixture snapshots
        id: fetch
        run: |
          failed=0
          python scripts/update_international.py --league italy || failed=1
          python scripts/update_international.py --league japan || failed=1
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Deep audit both feeds against TAURON schema
        run: python scripts/audit_international.py
      - name: Upload deep audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: italy-japan-deep-audit
          path: diagnostics/artifacts/international-deep-audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Push updates to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Other workflows or users may have updated main during long fetches.
          # Reset only the staging index to current remote without overwriting
          # generated data files or staging unrelated old checkout content.
          git fetch origin main
          git reset --mixed FETCH_HEAD
          git add data/italy.json data/japan.json
          if git diff --cached --quiet -- data/italy.json data/japan.json; then
            echo "No new calendar data."
            exit 0
          fi
          git commit -m 'chore: refresh Italy and Japan volleyball calendars'
          git push origin HEAD:main
      - name: Report unavailable upstream
        if: steps.fetch.outputs.failed == '1'
        run: |
          echo "An upstream failed; last good feed remains." >&2
          exit 1
