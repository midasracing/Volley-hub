name: Update II Liga Mężczyzn

on:
  push:
    paths:
      - ".github/workflows/update-2liga.yml"
      - "scripts/update_2liga.py"
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: update-2liga
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install scraper dependencies
        run: python -m pip install beautifulsoup4 requests
      - name: Install Puppeteer Extra and Stealth plugin
        run: npm install --no-save puppeteer puppeteer-extra puppeteer-extra-plugin-stealth
      - name: Fetch II Liga fixtures and results from PZPS
        run: python scripts/update_2liga.py
      - name: Commit updated schedule
        run: |
          if [ -z "$(git status --porcelain -- data/2liga.json)" ]; then
            echo "No schedule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/2liga.json
          git commit -m "Update II Liga Mężczyzn data"
          git pull --rebase origin main
          git push
