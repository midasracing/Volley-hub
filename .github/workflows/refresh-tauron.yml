name: Refresh men's TAURON Liga data
on:
  push:
    paths:
      - ".github/workflows/refresh-tauron.yml"
      - "scripts/refresh_tauron.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tauron-feed
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Scrape official public pages
        run: python scripts/refresh_tauron.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/tauron.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tauron.json
          git commit -m "Refresh official TAURON Liga data"
          git pull --rebase origin main
          git push
