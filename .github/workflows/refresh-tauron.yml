name: Refresh TAURON data

on:
  schedule:
    # Match hours (UTC covers both summer and winter time in Poland): every 5 minutes.
    - cron: "*/5 12-22 * * *"
    # Rest of the day: once, to pick up schedule and table changes.
    - cron: "20 6 * * *"
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

# Allows the job to push the updated JSON back to the repo.
permissions:
  contents: write

# Never run two refreshes at once (they would fight over the same commit).
concurrency:
  group: refresh-tauron
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Refresh data (TAURON Liga + TAURON 1. Liga, men)
        run: python scripts/refresh_tauron.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/tauron.json data/tauron1liga.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh TAURON data"
          git pull --rebase
          git push
