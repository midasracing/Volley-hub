name: Probe Italian and Japanese public volleyball endpoints
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - diagnostics/probe_international_api.py
      - .github/workflows/probe-international-api.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostic dependencies
        run: |
          python -m pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Inspect official public league pages
        run: python diagnostics/probe_international_api.py
      - name: Upload bounded report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: international-league-api-probe
          path: diagnostics/artifacts/international-api-probe.json
          retention-days: 3
          if-no-files-found: warn
