name: Validate VolleyStation importer
on:
  pull_request:
    paths:
      - .github/workflows/volleystation-importer.yml
      - scripts/update_volleystation.py
      - requirements-local-scraper.txt
      - data/2liga.json
      - data/pomorska3liga.json
  push:
    branches: [main]
    paths:
      - .github/workflows/volleystation-importer.yml
      - scripts/update_volleystation.py
      - requirements-local-scraper.txt
      - data/2liga.json
      - data/pomorska3liga.json
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 filelock psutil
      - name: Validate the production scraper
        run: |
          python -m py_compile scripts/update_volleystation.py
          python scripts/update_volleystation.py --league second --help
          python scripts/update_volleystation.py --league pomorska3liga --help
      - name: Validate published VolleyStation feeds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.update_volleystation import validate_output
          for name in ('2liga.json', 'pomorska3liga.json'):
              data = json.loads((Path('data') / name).read_text())
              print(name, validate_output(data))
          PY
