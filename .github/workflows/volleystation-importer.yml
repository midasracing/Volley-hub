name: Validate VolleyStation importer
on:
  pull_request:
    paths:
      - .github/workflows/volleystation-importer.yml
      - local_scraper/**
      - scripts/update_2liga.py
      - scripts/update_pomorska3liga.py
      - requirements-local-scraper.txt
      - data/2liga.json
      - data/pomorska3liga.json
  push:
    branches: [main]
    paths:
      - .github/workflows/volleystation-importer.yml
      - local_scraper/**
      - scripts/update_2liga.py
      - scripts/update_pomorska3liga.py
      - requirements-local-scraper.txt
      - data/2liga.json
      - data/pomorska3liga.json
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 filelock psutil
      - name: Validate production modules and entry points
        run: |
          python -m compileall -q local_scraper scripts/update_2liga.py scripts/update_pomorska3liga.py
          python -m local_scraper --help
          python scripts/update_2liga.py --help
          python scripts/update_pomorska3liga.py --help
      - name: Validate published VolleyStation feeds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from local_scraper.feed import validate_output
          for name in ('2liga.json', 'pomorska3liga.json'):
              data = json.loads((Path('data') / name).read_text())
              print(name, validate_output(data))
          PY
